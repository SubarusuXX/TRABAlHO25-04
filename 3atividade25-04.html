<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTADOR</title>
    <style>
        body{
            background-color: rgb(0, 0, 0);
            flex-direction: column;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .testo{
            text-align: center;
            margin-top: 50px;
        }
        #Valor{
            font-size: 3em;
            margin: 50px;
            padding: 5px;
            border-radius: 15px;
            background-color: blueviolet;
        }
        .botao{
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button{
            padding: 10px 30px;
            font-size: 50px;
            border: none;
            border-radius: 15px;
            background-color: black;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover{
            
            transform: scale(1.50);
        }
    </style>
</head>
<body>
    <div class="testo">
        <h1>CONTADOR</h1>
        <h1 id="Valor">0</h1>
    </div>

    <div class="botao">
        <button id="aumentar" onclick="aumentar()">+</button>
       
    </div>

    <script>
        let contador = 0;
        const limit = 10;
        const valorElement = document.getElementById("Valor");

        function updateDisplay() {
            valorElement.textContent = contador;
        }

        function aumentar() {
            if (contador < limit) {
                contador++;
                updateDisplay();
            } else {
                alert("limite maximo atingidou");
            }
        }

    
    </script>
</body>
</html>
