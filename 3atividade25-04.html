<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTADOR</title>
    <style>
        body {
            background-color: cadetblue;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        .testo {
            text-align: center;
            margin-bottom: 20px;
        }
        .botao {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        #Valor {
            font-size: 3em;
            margin: 10px 0;
        }
        button {
            padding: 10px 30px;
            font-size: 50px;
            border: firebrick;
            border-radius: 5px;
            background-color: #000000;
            color: white;
        }
        button:hover {
            background-color: #7100db;
        }
    
    </style>
</head>
<body>
    <div class="testo">
        <h1>CONTADOR</h1>
        <h1 id="Valor">0</h1>
    </div>

    <div class="botao">
        <button id="aumentar" onclick="aumentar()">+</button>
       
    </div>

    <script>
        let contador = 0;
        const limit = 10;
        const valorElement = document.getElementById("Valor");

        function updateDisplay() {
            valorElement.textContent = contador;
        }

        function aumentar() {
            if (contador < limit) {
                contador++;
                updateDisplay();
            } else {
                alert("limite maximo atingidou");
            }
        }

    
    </script>
</body>
</html>
