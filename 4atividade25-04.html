<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST003</title>

    <style>
        body{
            background-color: cadetblue;
            height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .testo{
            text-align: center;
        }
        .botao{
           display: flex;
           gap: 10px;
        }
        #Valor{
        font-size: 3em;
        padding: 5px;
        border-radius: 20px;
        background-color: white;
        }
       
       
    </style>
</head>
<body>
   
    <div class="testo">
        <h1>CONTADOR</h1>
    <h1 id="Valor">0</h1>
</div>

    <div class="botao" style="align-items: center;">
    <button id="aumentar"onclick="aumentar()">+</button>
    <button id="diminuir"onclick="diminuir()">-</button>
    <button id="resetar"onclick="resetar()">0</button>
</div>
   <script>
           let contador = 0;
           
            function aumentar(){
                contador++;
                updateDisplay(contador);
               
            };
            function diminuir(){
                contador--;
                updateDisplay(contador);
               
            };
            function resetar(){
             updateDisplay(contador=0);  
           
            };
            function updateDisplay(valor){
                document.getElementById("Valor").innerHTML= valor;
            }
   
   </script>
</body>
</html>
