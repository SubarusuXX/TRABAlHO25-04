<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST003</title>

    <style>
        body{
            background-color: cadetblue;
            flex-direction: column;
        }
        .testo{
            justify-content: center;
            align-items: center;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
            font-family: Arial, Helvetica, sans-serif;
        }
        .botao{
            justify-content: center;
            align-items: center;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
        }
       
       
    </style>
</head>
<body>
   
    <div class="testo">
        <h1>CONTADOR</h1>
    <h1 id="Valor">0</h1>
</div>

    <div class="botao" style="align-items: center;">
    <button id="aumentar"onclick="aumentar()">Aumentar</button>
    
</div>
   <script>
           let contador = 0;
           
            function aumentar(){
                contador++
                updateDisplay(contador);
               
            };
        
            function updateDisplay(valor){
                document.getElementById("Valor").innerHTML= valor;
            }
   
   </script>
</body>
</html>
